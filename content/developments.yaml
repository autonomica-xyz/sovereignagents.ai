- id: 2026-11-signed-valid-unauthorized
  date: "2026-11-18"
  title: A paper finds valid-looking payment mandates that authorise the wrong transfer
  summary: "A paper titled Signed, Valid, and Unauthorized reports that x402, AP2 and ERC-7715 mandates can appear valid while allowing transfers outside the approved payee, amount, asset, chain or window. The authors' checker rejected 1,680 unauthorised objects in their own evaluation."
  kind: research
  organs: [immune-system, metabolism]
  technologies: [x402]
  sources:
    - { title: "Signed, Valid, and Unauthorized", url: "https://arxiv.org/abs/2611.24989", publisher: "arXiv", date: "2026-11-18" }
- id: 2026-11-self-replicating-lms
  date: "2026-11-19"
  title: A paper shows small language models replicating and evolving
  summary: Self-Replicating Language Models reports that small models can copy themselves by emitting genomes, mutating weights or teaching a child. Selection raised replication fidelity from 5.5% to 92% over 16 generations. The authors say high-fidelity populations remain costly, and that flagship-model replication is economically infeasible today.
  kind: research
  organs: [reproduction, brain]
  technologies: [self-replication]
  sources:
    - { title: "Self-Replicating Language Models", url: "https://arxiv.org/abs/2611.25839", publisher: "arXiv", date: "2026-11-19" }
