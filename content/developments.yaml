  date: "2024-12-20"
  title: Spore.fun starts an evolution experiment for TEE agents
  summary: Agents in TEEs launch tokens and reproduce when a token reaches a valuation threshold. By late 2026 only the founder remains active.
  kind: organism
  organs: [reproduction]
  technologies: [self-replication]
  specimens: [spore-fun]
  sources:
