- id: 2026-08-chaindrop
  date: "2026-08-04"
  title: A self-replicating worm compromises more than 440 npm packages
  summary: Built on Mini Shai-Hulud code, the attack spreads through a hijacked maintainer account in under four hours. Any agent that installs dependencies at runtime is exposed.
  kind: attack
  organs: [immune-system]
  sources:
    - { title: "Massive supply-chain attack compromises 440 packages under four hours", url: "https://cyberscoop.com/supply-chain-attack-malware-mini-shai-hulud-teampcp/", publisher: "CyberScoop" }
