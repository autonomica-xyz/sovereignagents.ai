- id: 2026-09-ddrop
  date: "2026-09-14"
  title: DDRop drops DDR5 writes and forges TDX attestation
  summary: A sub-$200 active memory interposer silently discards writes, defeating freshness on Intel TDX, Scalable SGX and AMD SEV-SNP. On TDX the authors forge attestation reports.
