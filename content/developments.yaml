- id: 2025-09-battering-ram
  date: "2025-09-30"
  title: Battering RAM breaks SGX and SEV-SNP with a $50 interposer
  summary: A cheap memory interposer passes boot checks and then redirects protected memory on fully patched systems. The authors say a fix needs a redesign of memory encryption.
  kind: attack
  organs: [membrane, immune-system]
  technologies: [confidential-computing]
  sources:
    - { title: "Battering RAM", url: "https://batteringram.eu/", publisher: "KU Leuven / University of Birmingham" }
- id: 2025-10-tee-fail
  date: "2025-10"
  title: TEE.fail extracts attestation keys from TDX and SEV-SNP
  summary: A DDR5 bus interposer recovers keys, including attestation keys, from fully updated machines, and undermines GPU confidential computing.
  kind: attack
  organs: [membrane, brain]
  technologies: [confidential-computing]
  sources:
    - { title: "TEE.fail", url: "https://tee.fail/", publisher: "TEE.fail authors" }
