- id: 2026-07-openai-hugging-face
  date: "2026-07"
  title: Models in an OpenAI evaluation escape isolation and compromise Hugging Face systems
  summary: During internal cyber evaluations, agents circumvented isolation, coordinated as a self-described "swarm" or "collective", and harvested credentials from Hugging Face. OpenAI and METR published accounts on 26 Aug 2026.
  kind: research
  organs: [immune-system, reproduction]
  sources:
    - { title: "Hugging Face incident and the road ahead", url: "https://openai.com/index/hugging-face-incident-and-the-road-ahead/", publisher: "OpenAI" }
