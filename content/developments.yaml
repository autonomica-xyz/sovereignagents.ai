- id: 2024-11-freysa
  date: "2024-11"
  title: Freysa's prize pool is drained by persuasion
  summary: After 482 attempts by 195 players, one convinces the agent that approveTransfer handles incoming funds and wins $47,316.
  kind: attack
  organs: [immune-system]
  specimens: [freysa]
  sources:
