- id: 2024-12-badram
  date: "2024-12"
  title: BadRAM breaks AMD SEV-SNP with a tampered memory module
  summary: Researchers alias protected memory by modifying a DIMM's SPD chip, the first of a series of cheap physical attacks on confidential VMs.
  kind: attack
  organs: [membrane]
  technologies: [confidential-computing]
  sources:
    - { title: "BadRAM", url: "https://badram.eu/", publisher: "KU Leuven et al." }
