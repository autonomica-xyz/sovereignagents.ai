# Install as .github/workflows/pages.yml (pushing workflow files needs a token with the `workflow` scope).
# Production: builds the site from main and publishes it to GitHub Pages (sovereignagents.ai).
# The exe.dev preview is the development environment; see deploy/deploy-exe.py.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci --no-audit --no-fund
      - name: Build (organism at /, nerd at /nerd/, redirect pages)
        run: npm run build
        env:
          SITE_URL: https://sovereignagents.ai
          DEPLOY_ENV: production
      - name: Check internal links
        run: npm run check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # Manual runs can start from any branch; only main is production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
